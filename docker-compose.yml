services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: segundo_cerebro
      MYSQL_USER: segundo_cerebro
      MYSQL_PASSWORD: segundo_cerebro
      MYSQL_ROOT_PASSWORD: segundo_cerebro_root
    ports:
      - "53306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "segundo_cerebro", "-psegundo_cerebro"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Production-style app container. For local development prefer
  # `docker compose up -d db` + `npm run dev` (faster feedback loop).
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://segundo_cerebro:segundo_cerebro@db:3306/segundo_cerebro
    ports:
      - "3000:3000"
    profiles:
      - full

volumes:
  db_data:
