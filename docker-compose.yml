services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: segundo_cerebro
      POSTGRES_PASSWORD: segundo_cerebro
      POSTGRES_DB: segundo_cerebro
    ports:
      - "55432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U segundo_cerebro"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Production-style app container. For local development prefer
  # `docker compose up -d db` + `npm run dev` (faster feedback loop).
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://segundo_cerebro:segundo_cerebro@db:5432/segundo_cerebro
    ports:
      - "3000:3000"
    profiles:
      - full

volumes:
  db_data:
